<!DOCTYPE html>
<html>
<head>
    <title>VisionGuard Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <div class="logo">VisionGuard 🛡️</div>
        <ul>
            <li><a href="/">Upload</a></li>
            <li><a href="/history">History</a></li>
        </ul>
    </nav>
    <main>
        <h2>Analysis Result</h2>
        <div class="result-box {{ 'fake' if 'Fake' in verdict else 'real' }}">
            <h3>Verdict: {{ verdict }}</h3>
            <p><strong>Confidence:</strong> {{ (confidence * 100) | round(2) }}%</p>
        </div>
        <p class="caveat"><strong>Note:</strong> This model is an AI classifier and is not 100% accurate. Use as an assistive tool only.</p>
        <a href="/" class="btn">Analyze Another Image</a>
    </main>
</body>
</html>
